spring.application.name=gym-auth-service
server.port=8081

# Aiven MySQL. SSL is required; the connection is never downgraded to plaintext.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The gym_db schema is owned by the database. Hibernate only validates mappings; it never creates or alters tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.issuer=gym-auth-service
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=1800000

app.password-reset.otp-expiration-ms=300000
app.password-reset.max-attempts=5
app.password-reset.resend-cooldown-seconds=60
app.password-reset.max-requests-per-hour=5

# Gmail SMTP. Use a Google App Password (GMAIL_APP_PASSWORD), never the normal account password.
# The empty defaults let the service start without Gmail credentials; OTP emails then fail and are logged.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
